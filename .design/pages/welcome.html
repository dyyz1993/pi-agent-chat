    <style id="theme-vars">
      /* pi-agent-chat Design Tokens — 对齐项目实际颜色系统 */
      /* Generated: 2026-07-05 | Source: src/mainview/index.css (修正版) */

      /* ================================
   1. Background Colors
   ================================ */
      :root {
        --color-bg-primary: #edf1f6;
        --color-bg-secondary: #f8fafc;
        --color-bg-tertiary: #e7edf4;
        --color-bg-elevated: #ffffff;
        --color-bg-overlay: rgba(12, 18, 28, 0.48);
        --color-bg-input: #edf1f6;
      }
      .dark {
        --color-bg-primary: #0b111a;
        --color-bg-secondary: #111827;
        --color-bg-tertiary: #142033;
        --color-bg-elevated: #121b28;
        --color-bg-overlay: rgba(0, 0, 0, 0.6);
        --color-bg-input: #0d1520;
      }

      /* ================================
   2. Text Colors
   ================================ */
      :root {

      }

      /* ================================
   3. Border Colors
   ================================ */
      :root {
        --color-border-primary: #dce4ee;
        --color-border-secondary: #c7d2df;
        --color-border-focus: #246df3;
      }
      .dark {
        --color-border-primary: #334155;
        --color-border-secondary: #475569;
        --color-border-focus: #746cff;
      }

      /* ================================
   4. Accent Colors（修正：accent 统一 violet）
   ================================ */
      :root {
        --color-accent: #746cff;
        --color-accent-hover: #8d88ff;
        --color-accent-muted: rgba(116, 108, 255, 0.12);
        --color-accent-text: #6b4cf0;
        --color-accent-brand: #246df3;
        --color-accent-idle: #16845f;
        --color-accent-agent: #7f55cc;
      }
      .dark {
        --color-accent: #746cff;
        --color-accent-hover: #8d88ff;
        --color-accent-muted: rgba(116, 108, 255, 0.18);
        --color-accent-text: #a8b0ff;

        --color-accent-idle: #46dd89;
        --color-accent-agent: #ae7aff;
      }

      /* ================================
   5. Status Colors
   ================================ */
      :root {
        --color-success: #16845f;
        --color-warning: #b36b00;
        --color-error: #cf3654;
        --color-info: #246df3;
        --color-status-success: 22 132 95;
        --color-status-error: 207 54 84;
        --color-status-warning: 179 107 0;
        --color-status-info: 36 109 243;
      }
      .dark {
        --color-success: #46dd89;
        --color-warning: #eab308;
        --color-error: #f87171;
        --color-info: #2db6e8;
        --color-status-success: 70 221 137;
        --color-status-error: 248 113 113;
        --color-status-warning: 234 179 8;
        --color-status-info: 45 182 232;
      }

      /* ================================
   6. Semantic Colors（工具类型）
   ================================ */
      :root {
        --color-semantic-agent: 127 85 204;
        --color-semantic-tool: 0 128 149;
        --color-semantic-memory: 30 140 113;
        --color-semantic-notify: 186 86 36;
        --color-semantic-media: 236 72 153;
        --color-semantic-line: #dce4ee;
      }
      .dark {
        --color-semantic-agent: 174 122 255;
        --color-semantic-tool: 45 212 232;
        --color-semantic-memory: 45 212 191;
        --color-semantic-notify: 251 146 60;
        --color-semantic-media: 244 114 182;
        --color-semantic-line: #2b394d;
      }

      /* ================================
   7. Diff Colors
   ================================ */
      :root {
        --diff-bg: #f4f7fb;
        --diff-color: #17202e;
        --diff-added-bg: #dff6ea;
        --diff-added-color: #0e6e4e;
        --diff-removed-bg: #ffe2e9;
        --diff-removed-color: #b42345;
        --diff-word-added-bg: #c4ecd5;
        --diff-word-removed-bg: #ffc6d2;
        --diff-gutter-bg: #e8eef6;
        --diff-gutter-color: #69778a;
        --diff-highlight-bg: #dce6f1;
      }
      .dark {
        --diff-bg: #111b2a;
        --diff-color: #d6deea;
        --diff-added-bg: #102719;
        --diff-added-color: #72df9d;
        --diff-removed-bg: #2f151e;
        --diff-removed-color: #ff8a9c;
        --diff-word-added-bg: #183d28;
        --diff-word-removed-bg: #48202b;
        --diff-gutter-bg: #182538;
        --diff-gutter-color: #94a3b8;
        --diff-highlight-bg: #24344a;
      }

      /* ================================
   8. Surface Colors
   ================================ */
      :root {
        --surface-code: #eef4fa;
        --surface-hover: #eef3f9;
        --surface-dim: #f4f7fb;
      }
      .dark {
        --surface-code: #0e1724;
        --surface-hover: #1a2638;
        --surface-dim: #121b28;
      }

      /* ================================
   9. Typography
   ================================ */
      :root {
        --font-body:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB",
          "Segoe UI", ui-sans-serif, system-ui, sans-serif;
        --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        --font-size-xs: 11px;
        --font-size-caption: 12px;
        --font-size-body: 13px;
        --font-size-lead: 14px;
        --font-size-h3: 16px;
        --font-size-h2: 18px;
        --font-size-h1: 22px;
        --font-weight-normal: 400;
        --font-weight-medium: 500;
        --font-weight-semibold: 600;
        --line-height-body: 1.5;
        --line-height-heading: 1.25;
        --line-height-mono: 1.5;
      }

      /* ================================
   10. Spacing (4px grid)
   ================================ */
      :root {
        --spacing-xs: 4px;
        --spacing-sm: 8px;
        --spacing-md: 12px;
        --spacing-base: 16px;
        --spacing-lg: 20px;
        --spacing-xl: 24px;
        --spacing-2xl: 32px;
        --spacing-3xl: 48px;
      }

      /* ================================
   11. Border Radius
   ================================ */
      :root {
        --radius-sm: 4px;
        --radius-md: 6px;
        --radius-lg: 8px;
        --radius-xl: 10px;
        --radius-full: 9999px;
      }

      /* ================================
   12. Shadows
   ================================ */
      :root {
        --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.06);
        --shadow-md: 0 10px 24px -18px rgba(16, 24, 40, 0.3);
        --shadow-lg: 0 18px 42px -26px rgba(16, 24, 40, 0.38);
        --shadow-xl: 0 28px 64px -34px rgba(16, 24, 40, 0.45);
        --shadow-subtle: 0 1px 0 rgba(255, 255, 255, 0.78), 0 1px 2px rgba(16, 24, 40, 0.06);
        --shadow-floating: 0 18px 42px -26px rgba(16, 24, 40, 0.38);
      }
      .dark {
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4), 0 2px 4px -2px rgba(0, 0, 0, 0.3);
        --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.4), 0 4px 6px -4px rgba(0, 0, 0, 0.3);
        --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
        --shadow-subtle: 0 1px 0 rgba(255, 255, 255, 0.035), 0 1px 2px rgba(0, 0, 0, 0.3);
        --shadow-floating: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
      }

      /* ================================
   13. Transitions & Z-index
   ================================ */
      :root {
        --transition-fast: 100ms ease;
        --transition-normal: 150ms ease;
        --transition-slow: 250ms ease;
        --z-dropdown: 100;
        --z-popover: 200;
        --z-tooltip: 300;
        --z-modal: 400;
        --z-toast: 500;
      }

      /* ================================
   14. Consumer-Facing Aliases
   组件使用短别名引用 token，不直接引用 --color-* 变量
   ================================ */
      :root {
        /* Background aliases */
        --bg: var(--color-bg-primary);
        --bg-secondary: var(--color-bg-secondary);
        --bg-tertiary: var(--color-bg-tertiary);
        --bg-elevated: var(--color-bg-elevated);
        --bg-overlay: var(--color-bg-overlay);
        --bg-input: var(--color-bg-input);

        /* Text aliases */
        --text: var(--color-text-primary);
        --text-secondary: var(--color-text-secondary);
        --text-tertiary: var(--color-text-tertiary);
        --text-inverse: var(--color-text-inverse);
        --text-link: var(--color-accent);
        --text-link-hover: var(--color-accent-hover);

        /* Border aliases */
        --rule: var(--color-border-primary);
        --rule-secondary: var(--color-border-secondary);
        --ring: var(--color-border-focus);

        /* Accent aliases */
        --accent: var(--color-accent);
        --accent-hover: var(--color-accent-hover);
        --accent-muted: var(--color-accent-muted);
        --accent-text: var(--color-accent-text);

        /* Status aliases */
        --success: var(--color-success);
        --warning: var(--color-warning);
        --error: var(--color-error);
        --info: var(--color-info);
        --success-muted: rgba(var(--color-status-success), 0.1);
        --error-muted: rgba(var(--color-status-error), 0.1);
        --warning-muted: rgba(var(--color-status-warning), 0.1);
        --info-muted: rgba(var(--color-status-info), 0.1);

        /* Semantic aliases */
        --semantic-agent: rgb(var(--color-semantic-agent));
        --semantic-tool: rgb(var(--color-semantic-tool));
        --semantic-memory: rgb(var(--color-semantic-memory));
        --semantic-notify: rgb(var(--color-semantic-notify));
        --semantic-media: rgb(var(--color-semantic-media));

        /* Surface aliases */
        --surface: var(--color-bg-elevated);
        --surface-code: var(--surface-code);
        --surface-hover: var(--surface-hover);

        /* ================================
     15. Backward-Compatible Aliases
     兼容旧 .design 页面 body CSS 中的变量引用
     ================================ */
        /* The old pages use --bg-primary, --text-primary, --border-primary naming */
        --bg-primary: var(--color-bg-primary);
        --bg-secondary: var(--color-bg-secondary);
        --bg-elevated: var(--color-bg-elevated);
        --text-primary: var(--color-text-primary);
        --text-secondary: var(--color-text-secondary);
        --text-tertiary: var(--color-text-tertiary);
        --border-primary: var(--color-border-primary);
        --border-secondary: var(--color-border-secondary);

        /* Font aliases for old page body CSS */
        --font-sans:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB",
          "Segoe UI", ui-sans-serif, system-ui, sans-serif;
        --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Monaco, Consolas, monospace;

        /* Old semantic alias layer (for old body CSS compatibility) */
        --color-on-primary: #ffffff;
        --color-on-surface: var(--color-text-primary);
        --color-surface: var(--color-bg-elevated);
        --color-outline: var(--color-border-primary);
        --color-border: var(--color-border-primary);
        --color-error-container: rgba(var(--color-status-error), 0.12);
        --color-primary-container: rgba(var(--color-status-info), 0.1);
        --card: var(--color-bg-elevated);

        /* Pi-scale aliases for old body CSS that references --pi-violet-400 etc. */
        --pi-violet-400: var(--color-accent);
        --pi-memory-50: rgba(var(--color-semantic-memory), 0.1);
        --pi-tool-50: rgba(var(--color-semantic-tool), 0.1);
        --pi-success-50: rgba(var(--color-status-success), 0.1);
        --pi-blue-50: rgba(var(--color-status-info), 0.1);
        --pi-warning-50: rgba(var(--color-status-warning), 0.1);
        --pi-info-50: rgba(var(--color-status-info), 0.1);
        --pi-info-500: rgb(var(--color-status-info));
        --pi-success-500: rgb(var(--color-status-success));
        --pi-neutral-300: #a3b0c8;
        --primary: var(--color-accent);

        /* --- Spacing aliases (--space-N → --spacing-*) --- */
        --space-1: var(--spacing-xs);
        --space-2: var(--spacing-sm);
        --space-3: var(--spacing-md);
        --space-4: var(--spacing-base);
        --space-5: var(--spacing-xl);

        /* --- Sizing aliases --- */
        --size-button-height-sm: 28px;
        --size-button-height-md: 36px;
        --size-button-height-lg: 44px;
        --size-icon-sm: 16px;
        --size-icon-md: 20px;
        --size-icon-lg: 32px;
        --size-input-height: 36px;

        /* --- Shadow aliases (--shadow-N → --shadow-*) --- */
        --shadow-1: var(--shadow-sm);
        --shadow-2: var(--shadow-md);
        --shadow-3: var(--shadow-lg);
        --shadow-4: var(--shadow-xl);
        --shadow-5: var(--shadow-floating);

        /* --- Typography: font families --- */
        --font-heading: var(--font-body);
        --font-family-base: var(--font-body);

        /* --- Typography: font sizes --- */
        --font-size-h4: 16px;
        --font-size-eyebrow: var(--font-size-xs);
        --font-size-mono: var(--font-size-caption);
        --type-body-md: var(--font-size-body);
        --type-body-sm: var(--font-size-caption);

        /* --- Typography: font weights --- */
        --font-weight-h4: var(--font-weight-medium);
        --font-weight-eyebrow: var(--font-weight-semibold);
        --font-weight-caption: var(--font-weight-normal);
        --font-weight-body: var(--font-weight-normal);

        /* --- Typography: line heights --- */
        --line-height-caption: var(--line-height-body);

        /* --- Surface container tiers --- */
        --color-surface-container-low: var(--color-bg-secondary);
        --color-surface-container: var(--color-bg-tertiary);
        --color-surface-dim: var(--surface-dim);

        /* --- Primary semantic aliases --- */
        --color-primary: var(--color-accent);
        --color-primary-hover: var(--color-accent-hover);
        --primary-foreground: #ffffff;

        /* --- On-surface / outline variants --- */
        --color-on-surface-variant: var(--color-text-tertiary);
        --color-outline-variant: var(--color-border-secondary);

        /* --- Foreground --- */
        --color-foreground: var(--color-text-primary);

        /* --- Muted text --- */
        --text-muted: var(--color-text-tertiary);

        /* --- Error text on error bg --- */
        --on-error: #ffffff;

        /* --- Bare border alias --- */
        --border: var(--color-border-primary);

        /* --- Extra shadcn/ui standard aliases --- */
        --background: var(--color-bg-primary);
        --foreground: var(--color-text-primary);
        --card-foreground: var(--color-text-primary);
        --popover: var(--color-bg-elevated);
        --popover-foreground: var(--color-text-primary);
        --muted: var(--color-bg-secondary);
        --muted-foreground: var(--color-text-tertiary);
        --fg: var(--color-text-primary);
        --link: var(--color-accent);
        --link-hover: var(--color-accent-hover);
        --inverse-surface: var(--color-text-primary);
        --inverse-on-surface: var(--color-bg-primary);

        /* --- Direct-usable RGB color aliases (for body CSS that uses --color-status-* / --color-semantic-* without rgb() wrapper) --- */
        --color-status-success-direct: rgb(var(--color-status-success));
        --color-status-error-direct: rgb(var(--color-status-error));
        --color-status-warning-direct: rgb(var(--color-status-warning));
        --color-status-info-direct: rgb(var(--color-status-info));
        --color-semantic-agent-direct: rgb(var(--color-semantic-agent));
        --color-semantic-tool-direct: rgb(var(--color-semantic-tool));
        --color-semantic-memory-direct: rgb(var(--color-semantic-memory));
        --color-semantic-notify-direct: rgb(var(--color-semantic-notify));
        --color-semantic-media-direct: rgb(var(--color-semantic-media));

        /* Also keep raw --color-status-* / --color-semantic-* as direct color aliases for legacy usage */
        /* Note: this overrides the RGB-component format in sections 5/6 with direct color values */
        /* Use the --success/--error/--warning/--info and --semantic-* aliases instead */
        --surface-container-low: var(--color-surface-container-low);
      }
    </style>
    <style id="component-vars">
      /* ═══════════════════════════════════════════════════════════════
   components.css — Design System Component Definitions
   Auto-extracted from preview/component-*.html
   DO NOT EDIT MANUALLY — regenerate via extract-components-css.mjs
