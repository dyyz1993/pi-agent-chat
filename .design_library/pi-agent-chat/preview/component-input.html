<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Input — pi-agent-chat</title>
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      /* Page scaffold — NOT extracted */
      body {
        margin: 0;
        padding: var(--space-3);
        background: var(--color-surface);
        font-family: var(--font-family-base);
        color: var(--color-on-surface);
      }
      .stage {
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
        max-width: 640px;
      }
      .story {
        display: flex;
        flex-direction: column;
        gap: var(--space-2);
      }
      .rail {
        display: flex;
        gap: var(--space-3);
        align-items: stretch;
        flex-wrap: wrap;
      }
      .story-label {
        font-family: var(--font-body);
        font-size: var(--type-body-sm);
        font-weight: var(--font-weight-eyebrow);
        line-height: var(--line-height-eyebrow);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-muted);
      }
      .divider {
        border: none;
        border-top: 1px solid var(--color-outline-variant);
        margin: var(--space-1) 0;
      }

      /* @component-css-start */
      /* Component definitions — extracted to components.css by deterministic script */
      .input-wrap {
        display: inline-flex;
        align-items: center;
        gap: var(--space-1);
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        padding: 0 var(--space-2);
        height: var(--size-input-height);
        min-width: 200px;
        flex-shrink: 0;
        transition: border-color 0.15s;
      }
      .input-wrap:focus-within {
        border-color: var(--ring);
        outline: 2px solid var(--ring);
        outline-offset: -1px;
      }
      .input-wrap .prefix-icon {
        width: var(--size-icon-sm);
        height: var(--size-icon-sm);
        flex-shrink: 0;
        color: var(--color-on-surface-variant);
      }
      .input-field {
        border: none;
        outline: none;
        background: transparent;
        font-family: var(--font-family-base);
        font-size: var(--type-body-md);
        color: var(--color-on-surface);
        width: 100%;
        height: 100%;
      }
      .input-field::placeholder {
        color: var(--text-muted);
      }
      .input-wrap:hover {
        border-color: var(--color-on-surface-variant);
      }

      .chat-input-wrap {
        display: flex;
        flex-direction: column;
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        width: 100%;
        min-width: 360px;
        flex-shrink: 0;
        transition: border-color 0.15s;
      }
      .chat-input-wrap:focus-within {
        border-color: var(--ring);
        outline: 2px solid var(--ring);
        outline-offset: -1px;
      }
      .chat-input-wrap:hover {
        border-color: var(--color-on-surface-variant);
      }
      .chat-textarea {
        border: none;
        outline: none;
        background: transparent;
        font-family: var(--font-family-base);
        font-size: var(--type-body-md);
        color: var(--color-on-surface);
        width: 100%;
        resize: none;
        padding: var(--space-2) var(--space-3);
        min-height: 56px;
        line-height: var(--line-height-body);
      }
      .chat-textarea::placeholder {
        color: var(--text-muted);
      }
      .chat-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: var(--space-1) var(--space-2);
        border-top: 1px solid var(--color-outline-variant);
      }
      .chat-toolbar-left {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        color: var(--text-muted);
        font-size: var(--type-body-sm);
      }
      .chat-toolbar-right {
        display: flex;
        align-items: center;
        gap: var(--space-1);
      }
      .chat-action-icon {
        width: var(--size-icon-md);
        height: var(--size-icon-md);
        color: var(--color-on-surface-variant);
        cursor: pointer;
        flex-shrink: 0;
      }
      .chat-action-icon:hover {
        color: var(--color-on-surface);
      }
      .chat-send-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: var(--size-button-height-md);
        height: var(--size-button-height-md);
        border-radius: var(--radius-md);
        background: var(--color-primary);
        color: var(--color-on-primary);
        border: none;
        cursor: pointer;
        flex-shrink: 0;
        transition: background 0.15s;
      }
      .chat-send-btn:hover {
        background: var(--color-primary-hover);
      }
      .chat-send-btn svg {
        width: var(--size-icon-sm);
        height: var(--size-icon-sm);
      }
      /* @component-css-end */
    </style>
  </head>
  <body>
    <div class="stage">
      <!-- Row Group 1: Single-line Input variants -->
      <div class="story">
        <span class="story-label">Single-line Input</span>
        <div class="rail">
          <div class="input-wrap" data-evidence-sample="Single-line Input">
            <svg
              class="prefix-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input class="input-field" type="text" placeholder="Search bookmarks..." />
          </div>
          <div class="input-wrap" data-evidence-sample="Single-line Input disabled">
            <svg
              class="prefix-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input
              class="input-field"
              type="text"
              placeholder="Search bookmarks..."
              disabled
              style="opacity: 0.5; cursor: not-allowed"
            />
          </div>
        </div>
      </div>

      <hr class="divider" />

      <!-- Row Group 2: Chat Multiline Input -->
      <div class="story">
        <span class="story-label">Chat Multiline Input</span>
        <div class="rail">
          <div class="chat-input-wrap" data-evidence-sample="Chat Multiline Input">
            <textarea
              class="chat-textarea"
              rows="3"
              placeholder="Type a message, @file, @agent, or paste..."
            ></textarea>
            <div class="chat-toolbar">
              <div class="chat-toolbar-left">
                <span>@file</span>
                <span>@agent</span>
                <span style="margin-left: var(--space-2); color: var(--text-muted)"
                  >128 / 4096</span
                >
              </div>
              <div class="chat-toolbar-right">
                <svg
                  class="chat-action-icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"
                  />
                </svg>
                <button class="chat-send-btn" type="button">
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <line x1="22" y1="2" x2="11" y2="13" />
                    <polygon points="22 2 15 22 11 13 2 9 22 2" />
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
