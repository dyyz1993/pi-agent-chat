<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Button — pi-agent-chat</title>
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      /* Page scaffold */
      body {
        margin: 0;
        padding: var(--space-3);
        background: var(--color-surface);
        font-family: var(--font-body);
        color: var(--color-on-surface);
      }
      .row {
        display: flex;
        gap: var(--space-2);
        align-items: center;
        margin-bottom: var(--space-2);
        flex-wrap: wrap;
      }
      .label {
        font-size: var(--font-size-caption);
        font-weight: var(--font-weight-eyebrow);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--color-on-surface-variant);
        width: 92px;
        flex-shrink: 0;
      }
      .divider {
        border: none;
        border-top: 1px solid var(--color-outline-variant);
        margin: var(--space-3) 0;
      }

      /* @component-css-start */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-1);
        border: none;
        cursor: pointer;
        font-family: var(--font-body);
        font-weight: var(--font-weight-h4);
        white-space: nowrap;
        transition:
          background 0.15s,
          border-color 0.15s;
      }
      .btn-primary {
        background: var(--color-primary);
        color: var(--color-on-primary);
        border-radius: var(--radius-md);
      }
      .btn-primary:hover {
        background: var(--color-primary-hover);
      }
      .btn-ghost {
        background: transparent;
        color: var(--color-on-surface);
        border: 1px solid var(--color-outline);
        border-radius: var(--radius-md);
      }
      .btn-ghost:hover {
        background: var(--color-surface-container-low);
      }
      .btn-subtle {
        background: var(--color-surface-container-low);
        color: var(--color-on-surface);
        border-radius: var(--radius-md);
      }
      .btn-subtle:hover {
        background: var(--color-surface-container);
      }
      .btn-sm {
        height: var(--size-button-height-sm);
        padding: 0 var(--space-2);
        font-size: var(--font-size-caption);
        min-width: var(--size-button-height-sm);
      }
      .btn-md {
        height: var(--size-button-height-md);
        padding: 0 var(--space-3);
        font-size: var(--font-size-body);
        min-width: var(--size-button-height-md);
      }
      .btn-lg {
        height: var(--size-button-height-lg);
        padding: 0 var(--space-4);
        font-size: var(--font-size-body);
        min-width: var(--size-button-height-lg);
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        pointer-events: none;
      }
      /* @component-css-end */
    </style>
  </head>
  <body>
    <div class="row">
      <span class="label">Primary</span>
      <button class="btn btn-primary btn-sm">Send</button>
      <button class="btn btn-primary btn-md">Fork</button>
      <button class="btn btn-primary btn-lg">Rerun</button>
    </div>
    <div class="row">
      <span class="label">Ghost</span>
      <button class="btn btn-ghost btn-sm">Rollback Code</button>
      <button class="btn btn-ghost btn-md">Copy Output</button>
    </div>
    <hr class="divider" />
    <div class="row">
      <span class="label">Subtle</span>
      <button class="btn btn-subtle btn-sm">Cancel</button>
      <button class="btn btn-subtle btn-lg">Delete Selected</button>
    </div>
    <div class="row">
      <span class="label">Disabled</span>
      <button class="btn btn-primary btn-md" disabled>Fork</button>
      <button class="btn btn-ghost btn-md" disabled>Rollback Code</button>
      <button class="btn btn-subtle btn-md" disabled>Cancel</button>
    </div>
  </body>
</html>
