name: iOS CI

on:
  push:
    branches: [master, main]
    paths:
      - 'src/**'
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'package.json'
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    name: iOS Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - run: bun install

      - run: bun run build

      - name: Capacitor Sync iOS
        run: |
          if [ -d "ios" ]; then
            npx cap sync ios
          else
            echo "::warning::ios/ 目录不存在。请先在本地 Mac 上运行 bun run cap:add:ios"
            echo "iOS build skipped - no ios/ directory"
            exit 0
          fi

      - name: Build iOS
        working-directory: ios/App
        run: |
          if [ -f "Podfile" ]; then
            pod install
          fi
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15 Pro' \
            -derivedDataPath build \
            build \
            CODE_SIGNING_ALLOWED=NO | xcpretty || true

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build
          path: ios/App/build/
          retention-days: 7
