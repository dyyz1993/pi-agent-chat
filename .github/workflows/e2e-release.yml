name: E2E Release (LLM)

on:
  release:
    types: [prereleased, published]
  workflow_dispatch:

concurrency:
  group: e2e-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  llm:
    name: L4 LLM end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: node scripts/ci-hydrate-yalc.mjs
      - run: bun install
      - run: node scripts/ci-hydrate-yalc.mjs

      - run: bunx playwright install --with-deps chromium

      - run: bunx playwright test --project=llm --reporter=list
        env:
          CI: true
          ZAI_CODING_CN_API_KEY: ${{ secrets.ZAI_CODING_CN_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-llm-report
          path: playwright-report/
          retention-days: 30
