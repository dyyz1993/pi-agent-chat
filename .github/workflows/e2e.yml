name: E2E Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: node scripts/ci-hydrate-yalc.mjs
      - run: bun install
      - run: node scripts/ci-hydrate-yalc.mjs

      - run: bunx playwright install --with-deps chromium

      # L1 smoke (fast, every PR). The legacy project's compact/message specs
      # need real model round-trips, which CI cannot provide — run those
      # locally where a model + real sessions exist.
      - run: >
          bunx playwright test
          --project=smoke
          --reporter=list
          --max-failures=5
        env:
          CI: true
          E2E_AGENT_DIR: ${{ runner.temp }}/e2e-agent-dir

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
