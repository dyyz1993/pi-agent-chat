name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: |
          node scripts/ci-hydrate-yalc.mjs
          rm -f bun.lockb && bun install

      - name: Build Vite frontend
        run: bun run build

      - name: Build Electrobun desktop app
        run: bunx electrobun build
        env:
          CI: true
        timeout-minutes: 5

      - name: Locate .app bundle
        id: locate
        run: |
          APP_PATH=$(find build -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found in build/"
            exit 1
          fi
          APP_NAME=$(basename "$APP_PATH" .app)
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"

      - name: Ad-hoc sign and create DMG
        id: dmg
        run: |
          APP_PATH="${{ steps.locate.outputs.app_path }}"
          APP_NAME="${{ steps.locate.outputs.app_name }}"
          DMG_NAME="PiAgentChat-${GITHUB_REF_NAME}-macos-arm64.dmg"

          # Ad-hoc sign the app (removes "damaged" error on download)
          codesign --force --deep --sign - "$APP_PATH"

          # Create a temporary DMG folder
          mkdir -p dmg-staging
          cp -R "$APP_PATH" dmg-staging/

          # Create DMG
          hdiutil create -volname "$APP_NAME" -srcfolder dmg-staging -ov -format UDZO "$DMG_NAME"

          echo "dmg_path=$DMG_NAME" >> "$GITHUB_OUTPUT"

          # Cleanup
          rm -rf dmg-staging

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: PiAgentChat-macos-arm64
          path: ${{ steps.dmg.outputs.dmg_path }}
          retention-days: 5

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        shell: bash
        run: |
          node scripts/ci-hydrate-yalc.mjs
          rm -f bun.lockb && bun install

      - name: Build Vite frontend
        run: bun run build

      - name: Build Electrobun desktop app
        run: bunx electrobun build
        env:
          CI: true
        timeout-minutes: 5

      - name: Locate and zip exe
        shell: bash
        run: |
          EXE_PATH=$(find build -name "*.exe" -type f | head -1)
          if [ -z "$EXE_PATH" ]; then
            # Electrobun may produce a folder instead of .exe
            BUILD_DIR=$(find build -maxdepth 1 -type d | tail -1)
            if [ -d "$BUILD_DIR" ]; then
              cd "$(dirname "$BUILD_DIR")"
              7z a -tzip "PiAgentChat-${GITHUB_REF_NAME}-windows-x64.zip" "$(basename "$BUILD_DIR")"
              cd "$GITHUB_WORKSPACE"
            else
              echo "No build output found"
              exit 1
            fi
          else
            cp "$EXE_PATH" "PiAgentChat-${GITHUB_REF_NAME}-windows-x64.exe"
          fi

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: PiAgentChat-windows-x64
          path: |
            PiAgentChat-${{ github.ref_name }}-windows-x64.zip
            PiAgentChat-${{ github.ref_name }}-windows-x64.exe
          if-no-files-found: ignore
          retention-days: 5

  release:
    name: Publish Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PiAgentChat ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.zip
