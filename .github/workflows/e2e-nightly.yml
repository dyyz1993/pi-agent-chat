name: E2E Nightly

on:
  schedule:
    # 3:00 AM UTC every day
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: e2e-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly:
    name: L2 goal + L3 extensions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: node scripts/ci-hydrate-yalc.mjs
      - run: bun install
      - run: node scripts/ci-hydrate-yalc.mjs

      - run: bunx playwright install --with-deps chromium

      - run: >
          bunx playwright test
          --project=goal
          --project=extensions
          --reporter=list
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-nightly-report
          path: playwright-report/
          retention-days: 14

  # L2 weak-model matrix: replay production-shaped goal failures with the
  # weak model that hit them (glm-5.3-flash drafting a very large contract).
  # Requires the PI_MODELS_JSON repository secret (contents of
  # ~/.pi/agent/models.json). Without the secret the job skips gracefully.
  goal-weak-model:
    name: L4 goal e2e (weak model x large objective)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: node scripts/ci-hydrate-yalc.mjs
      - run: bun install
      - run: node scripts/ci-hydrate-yalc.mjs
      - name: Inject models.json from secret (skip when unset)
        env:
          PI_MODELS_JSON: ${{ secrets.PI_MODELS_JSON }}
        run: |
          if [ -z "$PI_MODELS_JSON" ]; then
            echo "PI_MODELS_JSON secret not set — skipping weak-model goal e2e."
            echo "SKIP_GOAL_E2E=1" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p ~/.pi/agent
          printf '%s' "$PI_MODELS_JSON" > ~/.pi/agent/models.json
      - name: Run real-LLM goal lifecycle (glm-5.3-flash, large objective)
        if: env.SKIP_GOAL_E2E != '1'
        env:
          PI_E2E_LLM: "1"
          PI_E2E_LLM_MODEL: zai/glm-5.3-flash
          PI_E2E_LLM_OBJECTIVE: |
            在当前工作区交付一个浏览器即可游玩的「经典坦克大战」单机网页游戏（单文件 index.html，纯手写 Canvas，零外部依赖），要求一次说明清楚、无需再向我提问：
            - 玩家坦克：方向键/WASD 四方向移动、空格射击，受边界与地形碰撞约束
            - 经典地形：砖墙（子弹可摧毁）、钢墙（子弹无效）、河流（坦克不可过）、草丛（视觉遮挡）、老鹰基地（被毁则失败）
            - 敌方坦克：顶部出生点分批刷新，自动移动/转向/射击 AI，至少 3 种类型，难度随关卡提升
            - 关卡：消灭全部敌人过关，至少 3 张地图，过关/失败结算与一键重开
            - HUD：常驻显示关卡、生命、剩余敌人和得分；击毁不同坦克按规则计分
            - 道具：至少 2 种（炸弹清屏、坦克加命、护盾、升级火力任选），拾取有反馈
            - 界面文案全部使用中文；不做联机、不做触屏适配、不做关卡编辑器
            请直接起草并提交完整契约（含全部授权），然后执行到全部机械校验通过。
        run: >
          bunx vitest run --config vitest.config.e2e.ts
          test/e2e-llm/verify/goal-autonomous-lifecycle.test.ts
