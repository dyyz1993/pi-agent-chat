name: E2E Nightly

on:
  schedule:
    # 3:00 AM UTC every day
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: e2e-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly:
    name: L2 goal + L3 extensions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: node scripts/ci-hydrate-yalc.mjs
      - run: bun install
      - run: node scripts/ci-hydrate-yalc.mjs

      - run: bunx playwright install --with-deps chromium

      - run: >
          bunx playwright test
          --project=goal
          --project=extensions
          --reporter=list
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-nightly-report
          path: playwright-report/
          retention-days: 14
