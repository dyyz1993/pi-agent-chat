<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818CF8"/>
      <stop offset="100%" style="stop-color:#A78BFA"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle with rounded corners effect -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)"/>
  
  <!-- Inner glow effect -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  
  <!-- Pi symbol stylized -->
  <g transform="translate(256, 256)">
    <!-- Left leg of Pi -->
    <path d="M-80 -80 L-80 100 Q-80 130 -50 130 L-30 130" 
          stroke="white" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          fill="none"/>
    
    <!-- Right leg of Pi -->
    <path d="M80 -80 L80 100 Q80 130 50 130 L30 130" 
          stroke="white" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          fill="none"/>
    
    <!-- Top bar of Pi -->
    <path d="M-95 -80 L95 -80" 
          stroke="white" 
          stroke-width="36" 
          stroke-linecap="round"
          fill="none"/>
    
    <!-- Chat bubble accent -->
    <circle cx="20" cy="50" r="16" fill="url(#accentGrad)" opacity="0.9"/>
    <circle cx="60" cy="20" r="10" fill="url(#accentGrad)" opacity="0.7"/>
  </g>
</svg>
